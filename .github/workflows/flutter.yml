name: Flutter UI validation and APK

on:
  push:
    branches:
      - main
      - feature/chat-settings-auth
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Android project structure
        run: |
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            echo "::error::Android Gradle project is missing. Restore the android/ folder from a complete Flutter project."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshmessage-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
