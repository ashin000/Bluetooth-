name: Flutter UI validation and APK

on:
  push:
    branches:
      - main
      - feature/chat-settings-auth
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshmessage-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
