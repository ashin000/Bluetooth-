name: Flutter build and APK

on:
  push:
    branches:
      - main
      - feature/chat-settings-auth
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate a clean Android wrapper
        run: |
          mkdir -p /tmp/meshmessage_android
          flutter create --platforms=android --org com.example --project-name mesh_message /tmp/meshmessage_android
          rm -rf android
          cp -a /tmp/meshmessage_android/android ./android
          mkdir -p android/app/src/main/kotlin/com/example/mesh_message
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp MainActivity.kt android/app/src/main/kotlin/com/example/mesh_message/MainActivity.kt
          mkdir -p android/app/src/main/res/drawable
          cp ic_meshmessage.xml android/app/src/main/res/drawable/ic_meshmessage.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meshmessage-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
